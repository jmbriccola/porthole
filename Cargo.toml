[workspace]
resolver = "2"
members = ["crates/porthole-core", "crates/porthole-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/jacopobriccola/porthole"
authors = ["Jacopo Maria Briccola <jacopo@maswitzerland.com>"]
description = "Open a port to your local network, temporarily and on purpose."

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
ipnet = { version = "2", features = ["serde"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
