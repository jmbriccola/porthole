[workspace]
resolver = "2"
members = [
    "crates/porthole-core",
    "crates/porthole-cli",
    "crates/porthole-helper",
    "crates/porthole-agent",
    "crates/porthole-gui",
]
# porthole-gui links gtk4/libadwaita, which need GTK4 development headers
# that are not installed -- and must not be installed -- on this development
# host, so here it only ever builds and runs inside
# tests/container/Containerfile.gui. The shipped product is a desktop
# application; this is a statement about this host's build environment, not
# about where the GUI is meant to run. Leaving it out of `default-members`
# keeps a flagless `cargo build`/`cargo test` at the workspace root working
# on this host exactly as before this crate existed. `--workspace` overrides
# `default-members` (it always means literally every member), so a command
# that passes `--workspace` explicitly still needs `--exclude porthole-gui`
# on this host, e.g. `cargo test --workspace --exclude porthole-gui`,
# `cargo clippy --workspace --all-targets --exclude porthole-gui -- -D warnings`,
# and `cargo +1.87 check --workspace --all-targets --exclude porthole-gui`.
# `porthole-gui` itself is built and tested only in the container:
#   podman build -t porthole-gui-test -f tests/container/Containerfile.gui tests/container
#   podman run --rm -v .:/src:z -w /src porthole-gui-test bash tests/container/gui-test.sh
default-members = [
    "crates/porthole-core",
    "crates/porthole-cli",
    "crates/porthole-helper",
    "crates/porthole-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "GPL-3.0-or-later"
repository = "https://github.com/jmbriccola/porthole"
authors = ["Jacopo Maria Briccola <jmbriccola@gmail.com>"]
description = "Open a port to your local network, temporarily and on purpose."

[workspace.dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ipnet = { version = "2", features = ["serde"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
# `sync` is not a convenience: an interface method's future is polled on
# zbus's own executor thread, which is not a tokio runtime context, so a
# `tokio::time` primitive used there panics ("there is no reactor running").
# `tokio::sync` is runtime-independent and is what `porthole_helper::retire`
# waits on from inside a method.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
toml = "1"
uuid = { version = "1", features = ["v4"] }
zbus = "5"
zbus_polkit = "5"
