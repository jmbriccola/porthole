[package]
name = "porthole-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Session agent that turns porthole's bus signals into desktop notifications."

[[bin]]
name = "porthole-agent"
path = "src/main.rs"

[dependencies]
porthole-core = { path = "../porthole-core" }
futures-util.workspace = true
libc.workspace = true
tokio.workspace = true
zbus.workspace = true

[dev-dependencies]
# For the one thing these tests cannot express without it: a stand-in helper
# that serves the *previous* shape of `WireRule`, so a real signature
# mismatch crosses a real bus. See `tests/session.rs`.
serde.workspace = true
tempfile.workspace = true
