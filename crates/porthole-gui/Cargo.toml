[package]
name = "porthole-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "GTK4/libadwaita application for porthole."

[lib]
name = "porthole_gui"
path = "src/lib.rs"

[[bin]]
name = "porthole-gui"
path = "src/main.rs"

# `harness = false`: see the module doc comment at the top of tests/window.rs
# for why. In short, gtk4-rs enforces that every GTK call in a process comes
# from whichever OS thread made the *first* one -- and cargo's normal test
# harness spawns each `#[test]` function on its own fresh thread, which trips
# that check the moment a second test touches GTK. Each `[[test]]` target is
# its own process, so a plain `fn main()` that runs its checks in sequence
# keeps everything on that process's one real main thread. A later task
# adding a new GTK-touching test file follows the same pattern: a new
# `[[test]]` entry here with `harness = false`, not more tests crammed into
# this one.
[[test]]
name = "window"
path = "tests/window.rs"
harness = false

# Same reasoning, same shape, its own process: `tests/open_now.rs` is task
# 3's own GTK-touching suite, kept out of `tests/window.rs` for exactly the
# reason that file's comment (and this one) says to.
[[test]]
name = "open_now"
path = "tests/open_now.rs"
harness = false

# Same reasoning again: `tests/listening.rs` is task 4's own GTK-touching
# suite for `ListeningSection`.
[[test]]
name = "listening"
path = "tests/listening.rs"
harness = false

# Same reasoning again: `tests/open_dialog.rs` is task 5's own GTK-touching
# suite for `OpenDialog`.
[[test]]
name = "open_dialog"
path = "tests/open_dialog.rs"
harness = false

# Same reasoning again, and one addition of its own: `tests/devices_dialog.rs`
# points `PORTHOLE_DEVICES_FILE` at a temporary directory, process-wide,
# before any case runs -- every save and every forget in it writes a real
# `devices.toml` through the real `porthole_core::devices::Book`, and none of
# it may reach the address book of whoever is running the tests. That
# variable is process-wide, which is the second reason this is its own
# `[[test]]` rather than cases added to `tests/open_dialog.rs`.
[[test]]
name = "devices_dialog"
path = "tests/devices_dialog.rs"
harness = false

# Same reasoning again: `tests/status_bar.rs` is task 6's own GTK-touching
# suite for `StatusBar`. Task 6's other additions -- the initial load, the
# keyboard-reachability check, and the breakpoint accessor -- extend
# `tests/window.rs` and `tests/open_now.rs` instead, since both already
# exist for the exact things those additions changed.
[[test]]
name = "status_bar"
path = "tests/status_bar.rs"
harness = false

# Same reasoning again, and one addition of its own: `tests/signals.rs`
# points `DBUS_SYSTEM_BUS_ADDRESS` at the private session bus this whole
# target runs under, so the window's own system-bus connection reaches a
# stand-in helper served from inside the test. That environment variable is
# process-wide, and every other target here depends on there being no system
# bus at all, which is the second reason this is its own `[[test]]` rather
# than cases added to `tests/window.rs`.
[[test]]
name = "signals"
path = "tests/signals.rs"
harness = false

# Same reasoning again: `tests/busy.rs` is the busy-indication suite. Its
# own target rather than cases added elsewhere for the usual reason, plus
# one of its own: every check in it has to drain the main context across a
# real `crate::busy::BUSY_DELAY`, which no other file here needs to do.
[[test]]
name = "busy"
path = "tests/busy.rs"
harness = false

# Same reasoning again, plus one of its own: `tests/version_mismatch.rs`
# serves the *previous* shape of `WireRule` under the helper's well-known
# name, which only one connection can hold at a time -- so it cannot share
# `tests/signals.rs`'s stand-in, which serves the current shape. It sets
# `DBUS_SYSTEM_BUS_ADDRESS` for the same process-wide reason that file does.
[[test]]
name = "version_mismatch"
path = "tests/version_mismatch.rs"
harness = false

# Same reasoning again, plus the same one `tests/version_mismatch.rs` has:
# `tests/retirement.rs` hands the helper's well-known name from one stand-in
# connection to the next, which is the whole subject of the file and which
# only one connection can hold at a time -- so it cannot share
# `tests/signals.rs`'s stand-in, and no other target here may have a system
# bus while it runs.
[[test]]
name = "retirement"
path = "tests/retirement.rs"
harness = false

# Same reasoning again, and one addition of its own: `tests/identity.rs`
# runs `app::build()`, which sets `prgname` -- process-wide state, and the
# state whose value that file's whole point is to measure. Every other
# target here builds `adw::Application`s under ids of its own; keeping this
# one in its own process is what leaves each of those measuring what it
# meant to.
[[test]]
name = "identity"
path = "tests/identity.rs"
harness = false

# Same reasoning again, and one addition of its own: `tests/update_consent.rs`
# points `PORTHOLE_UPDATE_FILE` at a temporary directory, process-wide, before
# any case runs. Every case below reads -- and two of them write -- a real
# `update.toml` through the real `porthole_core::update::Settings`, and none
# of it may reach the settings of whoever is running the tests. That variable
# is process-wide, which is the second reason this is its own `[[test]]`
# rather than cases added to `tests/window.rs`.
[[test]]
name = "update_consent"
path = "tests/update_consent.rs"
harness = false

[dependencies]
porthole-core = { path = "../porthole-core" }
gtk = { package = "gtk4", version = "0.9" }
# v1_5: `adw::Dialog` (task 5's `OpenDialog`) was added in libadwaita 1.5.
# Implies v1_4/v1_3/v1_2/v1_1 through the crate's own feature chain, so
# nothing tasks 3-4 already used stops compiling.
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
ipnet.workspace = true
zbus.workspace = true
tokio.workspace = true
# One combined stream over the helper's three signals -- see
# `window.rs`'s own `subscribe`. `porthole-agent` already takes this
# dependency for the same job on the same signals.
futures-util.workspace = true

[dev-dependencies]
# For the one thing these tests cannot express without it: a stand-in helper
# and a message body in the *previous* shape of `WireRule`, so a real
# signature mismatch is what the window meets. See `window.rs`'s own tests
# and `tests/signals.rs`.
serde.workspace = true
