<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the name. Anyone may talk to it: deciding who may do
       what is polkit's job, not the bus's, and `close` must be reachable by
       everyone because closing reduces exposure. -->
  <policy user="root">
    <allow own="com.jacopobriccola.Porthole"/>
  </policy>
  <policy context="default">
    <allow send_destination="com.jacopobriccola.Porthole"/>
    <allow receive_sender="com.jacopobriccola.Porthole"/>
  </policy>
</busconfig>
